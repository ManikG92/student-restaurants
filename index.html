<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Restaurants Finland</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="header-container">
        <div class="brand">
          <h1>Student Restaurants in Finland</h1>
          <p>Campus cafeterias, daily and weekly menus, and locations</p>
        </div>
        <div id="auth-controls" class="auth-bar">
          <!-- Injected dynamically: Login/Register buttons or User Badge -->
        </div>
      </div>
    </header>

    <main>
      <!-- Profile & Favorite -->
      <section id="user-profile-section" class="profile-card hidden">
        <div class="profile-info">
          <img
            id="user-avatar"
            src="https://place-hold.it/80x80"
            alt="Avatar"
          />
          <div>
            <h3 id="profile-username">User</h3>
            <p id="profile-email">email@example.com</p>
            <p id="profile-fav">Favorite restaurant:<em>None selected</em></p>
          </div>
        </div>
        <div class="avatar-upload-box">
          <label for="avatar-input">Change Avatar:</label>
          <input type="file" id="avatar-input" accept="image/*" />
          <button id="upload-avatar-btn" type="button">Upload</button>
        </div>
      </section>

      <!-- Filter & Search -->
      <section class="controls-section">
        <div class="control-group">
          <label for="city-filter">Filter by City:</label>
          <select id="city-filter">
            <option value="all">All Cities</option>
          </select>
        </div>

        <div class="control-group">
          <label for="provider-filter">Filter by Provider:</label>
          <select id="provider-filter">
            <option value="all">All providers</option>
          </select>
        </div>

        <div class="control-group">
          <label for="search-input">Search:</label>
          <input
            type="text"
            id="search-input"
            placeholder="Search by name or address..."
          />
        </div>

        <button id="locate-btn" type="button">Near me</button>
      </section>

      <!-- Leaflet Map -->
      <section id="map-container">
        <div id="map"></div>
      </section>

      <!-- Restaurants Table -->
      <section class="list-section">
        <h2>Available Restaurants</h2>
        <div class="table-wrapper">
          <table id="restaurants-table">
            <thead>
              <tr>
                <th>Fav</th>
                <th>Name</th>
                <th>Address</th>
                <th>City</th>
                <th>Provider</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="restaurant-rows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- Menu Dialog -->
    <dialog id="menu-modal">
      <div class="modal-header">
        <h3 id="modal-restaurant-name">Menu</h3>
        <button id="close-modal-btn" type="button">&times;</button>
      </div>
      <div class="menu-tabs">
        <button id="daily-tab" class="tab-btn active" type="button">
          Daily Menu
        </button>
        <button id="weekly-tab" class="tab-btn" type="button">
          Weekly Menu
        </button>
      </div>
      <div id="modal-menu-content">
        <p>Loading menu...</p>
      </div>
    </dialog>

    <!-- Login or Register Dialog -->
    <dialog id="auth-modal">
      <div class="modal-header">
        <h3 id="auth-modal-title">Sign In</h3>
        <button id="close-auth-modal" type="button">&times;</button>
      </div>
      <form id="auth-form">
        <div class="form-group">
          <label for="auth-username">Username:</label>
          <input type="text" id="auth-username" required />
        </div>
        <div class="form-group" id="email-field-group">
          <label for="auth-email">Email:</label>
          <input type="email" id="auth-email" />
        </div>
        <div class="form-group">
          <label for="auth-password">Password:</label>
          <input type="password" id="auth-password" required />
        </div>
        <button type="submit" id="auth-submit-btn">Login</button>
        <p class="auth-toggle-text">
          <span id="auth-switch-prompt">Don't have an account?</span>
          <a href="#" id="auth-switch-link">Register here</a>
        </p>
        <p id="auth-error-msg" class="error-text"></p>
      </form>
    </dialog>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
